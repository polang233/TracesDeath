name: TracesDeath
description: 玩家死亡遗体与原槽位物品领取
version: '2.0.1'
authors: [Polang]
website: https://github.com/PolangPlugin/TracesDeath
main: cc.sbsj.mc.tracesdeath.TracesDeath
api-version: '1.13'
load: POSTWORLD
commands:
  tracesdeath:
    description: 查看遗体位置
    usage: /td list | /td locate | /td testpack [玩家]
    aliases: [td, deathtrace]
permissions:
  tracesdeath.use:
    description: 死亡时生成遗体
    default: true
  tracesdeath.admin:
    description: 查看所有遗体并绕过所有者限制
    default: op
