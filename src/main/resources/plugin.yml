name: TracesDeath
description: 玩家死亡遗体与原槽位物品领取
version: '3.0-SNAPSHOT'
authors: [Polang]
website: https://github.com/PolangPlugin/TracesDeath
main: cc.sbsj.mc.tracesDeath.TracesDeath
api-version: '1.21.9'
load: POSTWORLD
commands:
  tracesdeath:
    description: 查看遗体位置
    usage: /td list | /td locate
    aliases: [td, deathtrace]
permissions:
  tracesdeath.use:
    description: 死亡时生成遗体
    default: true
  tracesdeath.admin:
    description: 查看所有遗体并绕过所有者限制
    default: op
